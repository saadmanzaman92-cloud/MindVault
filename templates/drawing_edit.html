{% extends "_app.html" %}
{% set active='drawings' %}
{% block title %}Drawing · MindVault{% endblock %}
{% block content %}

<div class="page-head">
  <input class="editor-title"
         id="dTitle"
         value="{{ drawing.title if drawing else 'Untitled Sketch' }}"
         style="max-width:360px">

  <div class="toolbar">

    <span class="save-badge">
      <span class="save-dot" id="dDot"></span>
      <span id="dMsg">Ready</span>
    </span>

    <button class="btn btn-primary"
            id="saveBtn">
            💾 Save
    </button>

    <button class="btn"
            onclick="prevPage()">
            ⬅ Prev
    </button>

    <button class="btn"
            onclick="nextPage()">
            Next ➜
    </button>

    <button class="btn btn-primary"
            onclick="newPage()">
            ＋ New Page
    </button>

    <span id="pageInfo"
          style="padding:8px 12px;">
          Page 1
    </span>

    <a class="btn"
       href="{{ url_for('drawings') }}">
       ← All drawings
    </a>

  </div>
</div>

<div class="draw-shell">

  <div class="draw-tools">

    <div>
      <label>Tool</label>

      <div class="tool-group"
           id="toolGroup">

        <button class="tool-pick active"
                data-tool="pen">
                Pen
        </button>

        <button class="tool-pick"
                data-tool="pencil">
                Pencil
        </button>

        <button class="tool-pick"
                data-tool="brush">
                Brush
        </button>

        <button class="tool-pick"
                data-tool="eraser">
                Eraser
        </button>

      </div>
    </div>

    <div>
      <label>Color</label>

      <input type="color"
             id="color"
             value="#0a0d12">
    </div>

    <div>
      <label>
        Size ·
        <span id="sizeVal">3</span>px
      </label>

      <input type="range"
             id="size"
             min="1"
             max="60"
             value="3">
    </div>

    <div>
      <label>Background</label>

      <input type="color"
             id="bg"
             value="#ffffff">
    </div>

    <button class="btn btn-danger"
            id="clearBtn">
            🗑 Clear canvas
    </button>

    <p class="muted"
       style="font-size:12px;margin:0">
       Mouse, touch & stylus supported.
    </p>

  </div>

  <div class="draw-canvas-wrap">
      <canvas id="drawCanvas"></canvas>
  </div>

</div>

<script>

const drawingId =
{{ drawing.id if drawing else 'null' }};

const existingImg =
"{{ url_for('static',
filename='drawings/' ~ drawing.filename)
if drawing else '' }}";

const canvas =
document.getElementById('drawCanvas');

const ctx =
canvas.getContext('2d');

const wrap =
canvas.parentElement;

let tool='pen';
let color='#0a0d12';
let size=3;
let bg='#ffffff';

let isDrawing=false;
let lastX=0;
let lastY=0;

let pages=[];
let currentPage=0;

function resize(){

    const r =
    wrap.getBoundingClientRect();

    const dpr =
    window.devicePixelRatio || 1;

    canvas.width =
    r.width*dpr;

    canvas.height =
    r.height*dpr;

    canvas.style.width =
    r.width+'px';

    canvas.style.height =
    r.height+'px';

    ctx.setTransform(
      1,0,0,1,0,0
    );

    ctx.scale(dpr,dpr);

    ctx.fillStyle=bg;

    ctx.fillRect(
      0,
      0,
      r.width,
      r.height
    );

    if(existingImg && !canvas._loaded){

        const img =
        new Image();

        img.onload=()=>{

            ctx.drawImage(
                img,
                0,
                0,
                r.width,
                r.height
            );

            canvas._loaded=true;
        };

        img.src =
        existingImg +
        '?t=' +
        Date.now();
    }
}

window.addEventListener(
'resize',
resize
);

setTimeout(
resize,
30
);

document
.querySelectorAll(
'#toolGroup .tool-pick'
)
.forEach(b=>{

    b.onclick=()=>{

        document
        .querySelectorAll(
        '#toolGroup .tool-pick'
        )
        .forEach(x=>
            x.classList.remove(
            'active'
            )
        );

        b.classList.add(
        'active'
        );

        tool=
        b.dataset.tool;
    };
});

document
.getElementById(
'color'
)
.oninput=
e=>
color=e.target.value;

document
.getElementById(
'size'
)
.oninput=
e=>{

    size=
    +e.target.value;

    document
    .getElementById(
    'sizeVal'
    )
    .textContent=
    size;
};

document
.getElementById(
'bg'
)
.oninput=
e=>{

    bg=
    e.target.value;
};

document
.getElementById(
'clearBtn'
)
.onclick=()=>{

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle=
    bg;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );
};

function pos(e){

    const r =
    canvas.getBoundingClientRect();

    return{
        x:
        e.clientX-r.left,

        y:
        e.clientY-r.top
    };
}

function start(e){

    isDrawing=true;

    const p=
    pos(e);

    lastX=p.x;
    lastY=p.y;
}

function end(){

    isDrawing=false;

    ctx.beginPath();
}

function draw(e){

    if(!isDrawing)
        return;

    const p=
    pos(e);

    ctx.lineCap='round';
    ctx.lineJoin='round';

    let s=size;

    if(tool==='pen'){
        ctx.strokeStyle=color;
    }

    else if(tool==='pencil'){
        ctx.strokeStyle=color;
        s=size*0.7;
    }

    else if(tool==='brush'){
        ctx.strokeStyle=color;
        s=size*1.5;
    }

    else if(tool==='eraser'){
        ctx.strokeStyle=bg;
        s=size*2;
    }

    ctx.lineWidth=s;

    ctx.beginPath();

    ctx.moveTo(
        lastX,
        lastY
    );

    ctx.lineTo(
        p.x,
        p.y
    );

    ctx.stroke();

    lastX=p.x;
    lastY=p.y;
}

function saveCurrentPage(){

    pages[currentPage]=
    canvas.toDataURL();
}

function loadPage(index){

    const img=
    new Image();

    img.onload=()=>{

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.fillStyle=bg;

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.drawImage(
            img,
            0,
            0,
            canvas.width/
            (window.devicePixelRatio||1),
            canvas.height/
            (window.devicePixelRatio||1)
        );
    };

    if(pages[index]){

        img.src=
        pages[index];
    }

    else{

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.fillStyle=
        bg;

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );
    }

    document
    .getElementById(
    'pageInfo'
    )
    .textContent=
    "Page " +
    (currentPage+1);
}

function newPage(){

    saveCurrentPage();

    pages.push(null);

    currentPage=
    pages.length-1;

    loadPage(currentPage);
}

function nextPage(){

    saveCurrentPage();

    if(
      currentPage <
      pages.length-1
    ){

        currentPage++;

        loadPage(
        currentPage
        );
    }
}

function prevPage(){

    saveCurrentPage();

    if(currentPage>0){

        currentPage--;

        loadPage(
        currentPage
        );
    }
}

pages.push(null);

canvas.addEventListener(
'pointerdown',
start
);

canvas.addEventListener(
'pointermove',
draw
);

window.addEventListener(
'pointerup',
end
);

document
.getElementById(
'saveBtn'
)
.onclick=
async()=>{

    const dot=
    document
    .getElementById(
    'dDot'
    );

    const msg=
    document
    .getElementById(
    'dMsg'
    );

    dot.classList.add(
    'saving'
    );

    msg.textContent=
    'Saving…';

    const data=
    canvas.toDataURL(
    'image/png'
    );

    const res=
    await fetch(
    '/api/drawing/save',
    {
        method:'POST',

        headers:{
            'Content-Type':
            'application/json'
        },

        body:
        JSON.stringify({

            id:drawingId,

            title:
            document
            .getElementById(
            'dTitle'
            ).value,

            image:data
        })
    });

    const j=
    await res.json();

    dot.classList.remove(
    'saving'
    );

    if(j.ok){

        msg.textContent=
        'Saved';

        if(!drawingId){
            window.location=
            '/drawing/'+j.id;
        }
    }

    else{
        msg.textContent=
        'Failed';
    }
};

</script>

{% endblock %}

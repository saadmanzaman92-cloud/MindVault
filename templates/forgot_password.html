<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
</head>
<body style="background:#0f1117;color:white;font-family:Arial;">
    <h2>Reset Password</h2>

    <form method="POST">
        <input type="email"
               name="email"
               placeholder="Enter Gmail"
               required>

        <button type="submit">
            Send Reset Link
        </button>
    </form>
</body>
</html>
